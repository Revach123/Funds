name: fetch-k203-history
on:
  schedule:
    # רשת ביטחון בלבד - התקציב עכשיו גדול (שעות), אז ריצה בודדת עשויה
    # לכסות את כל מה שנשאר; כל 6 שעות מספיק כדי לתפוס המשך אם ריצה נכשלה
    # בלי ליצור עומס בתור (concurrency group אחד, cancel-in-progress:false).
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      budget_seconds:
        description: "Max seconds to spend fetching before stopping and committing (default 10800 = 3h)"
        required: false
        default: "10800"
      history_start:
        description: "Override HISTORY_START (YYYY-MM-DD) for testing a narrower/more recent range"
        required: false
        default: ""
permissions:
  contents: write
concurrency:
  group: fetch-k203-history
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    # תקציב ברירת מחדל (3 שעות) + commit/push לכל חודש - מרווח נדיב מעל
    # ה-budget (עד תקרת ה-360 דק' של GitHub Actions) כדי ש-git push של
    # קבצים גדולים לא ייחתך ע"י timeout של ה-job. ריפו ציבורי = דקות חינם.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Configure git
        # git config *לפני* הסקריפט - הוא מבצע commit+push בעצמו אחרי כל
        # חודש שהושלם (במקום commit ענק אחד בסוף), כדי שאם הריצה נכשלת/
        # נחתכת באמצע לא נאבד את כל מה שכבר הורד.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Fetch batch of ק203 reports (commits after each completed month)
        env:
          RUN_BUDGET_SECONDS: ${{ inputs.budget_seconds }}
          HISTORY_START: ${{ inputs.history_start }}
        run: python scripts/fetch_k203_history.py
      - name: Final safety-net commit
        # ברוב המקרים הסקריפט כבר commit+push הכל בעצמו; זה רק תופס שאריות
        # (למשל אם ה-push האחרון בתוך הסקריפט נכשל אחרי 5 נסיונות).
        run: |
          git add state
          [ -d reports ] && git add reports || true
          git diff --staged --quiet && echo "no changes" && exit 0
          git commit -m "k203: safety-net commit $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "push succeeded on attempt $i"
              exit 0
            fi
            echo "push rejected - rebasing and retrying ($i)"
            git pull --rebase origin main
          done
          echo "push failed after 5 attempts"
          exit 1
